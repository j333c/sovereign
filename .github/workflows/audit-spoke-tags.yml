name: Upstream Spoke Dependency Governance Audit

on:
  schedule:
    # Daily at 03:00 UTC (aligning with default unattended maintenance window)
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Audit Upstream OCI Spoke Tags
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Spoke Tag Audit Suite
        run: ./scripts/audit-spoke-tags.sh
