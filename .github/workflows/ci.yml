name: Continuous Integration

on:
  push:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - 'release/**'
      - 'hotfix/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Go Vet
        run: go vet ./...

      - name: Run Backend Tests
        run: go test -v -count=1 ./...

      - name: Build Supervisor Daemon Binary
        run: |
          mkdir -p bin
          CGO_ENABLED=0 go build -o bin/sovereign-daemon ./cmd/sovereign-daemon

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Dependencies
        run: npm --prefix web ci

      - name: Run Frontend Tests
        run: npm --prefix web test

      - name: Build Next.js Production Bundle
        run: npm --prefix web run build

  governance-and-scripts:
    name: Spoke Governance & Script Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install Frontend Dependencies (for test prerequisites)
        run: npm --prefix web ci

      - name: Spoke Dependency Governance Tag Audit
        run: ./scripts/audit-spoke-tags.sh

      - name: Dual-Remote Verification Script Tests
        run: ./tests/verify_remotes_test.sh

      - name: Host Installer Matrix & Script Tests
        run: ./tests/installer_test.sh

      - name: Spoke Audit Test Suite
        run: ./tests/audit_spoke_tags_test.sh

      - name: Release Publishing Pipeline Test Suite
        run: ./tests/publish_release_test.sh
