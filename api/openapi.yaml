openapi: 3.1.0
info:
  title: Sovereign Core Supervisor API
  version: 0.1.0
  description: |
    Core control plane API for Sovereign Home Server appliance supervisor.
    Provides health diagnostics, boot lifecycle monitoring, and control boundaries.
servers:
  - url: http://localhost:8080
    description: Local daemon direct port
  - url: /
    description: Same-origin ingress gateway

paths:
  /api/v1/health:
    get:
      summary: Appliance health probe
      description: Returns the operational status of the supervisor daemon and database durability engine.
      operationId: getHealth
      responses:
        '200':
          description: Supervisor and database are operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database or core subsystem is unhealthy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/system/boot-status:
    get:
      summary: Boot status and diagnostic integrity
      description: Returns the current boot tier, clean shutdown status, and diagnostic results.
      operationId: getBootStatus
      responses:
        '200':
          description: System boot status details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootStatusResponse'
        '500':
          description: Internal supervisor error retrieving boot state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Storage mount is degraded or read-only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/system/ingress:
    get:
      summary: Ingress gateway and mDNS discovery status
      description: Returns operational status of Caddy ingress gateway, dynamic route table, and mDNS responder.
      operationId: getIngressStatus
      responses:
        '200':
          description: Ingress and network discovery status details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressStatusResponse'
        '500':
          description: Internal supervisor error retrieving ingress status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/disks:
    get:
      summary: Enumerate available block devices
      description: Returns list of unmounted/available SATA/NVMe block devices with capacity.
      operationId: getDisks
      responses:
        '200':
          description: List of available storage disks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisksResponse'
        '500':
          description: Internal supervisor error retrieving block devices.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/initialize:
    post:
      summary: Format and initialize local storage pool
      description: Partitions and formats disk with ext4 write-ahead journaling and mounts under /data.
      operationId: initializeStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageInitializeRequest'
      responses:
        '200':
          description: Storage pool successfully initialized and mounted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageInitializeResponse'
        '400':
          description: Invalid device or device is in use / protected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error formatting or mounting storage pool.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/nas/test:
    post:
      summary: Test network storage credentials
      description: Performs non-destructive credential and mount accessibility test.
      operationId: testNAS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageNASTestRequest'
      responses:
        '200':
          description: Network storage credentials and connectivity verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageNASTestResponse'
        '400':
          description: Authentication failed or invalid configuration.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error testing network storage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/nas/mount:
    post:
      summary: Save and mount network storage share
      description: Mounts network share to /data/media or target folder and persists config in SQLite.
      operationId: mountNAS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageNASMountRequest'
      responses:
        '200':
          description: Network storage share mounted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageNASMountResponse'
        '400':
          description: Invalid NAS request or failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Mount execution failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/status:
    get:
      summary: Get storage pool and NAS mount status
      description: Returns operational status, filesystem capacity, local pool, and network share health.
      operationId: getStorageStatus
      responses:
        '200':
          description: Storage status and capacity telemetry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStatusResponse'
        '500':
          description: Internal supervisor error retrieving storage status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - database
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        version:
          type: string
          example: 0.1.0
        database:
          type: string
          enum: [connected, disconnected, error]
          example: connected

    BootStatusResponse:
      type: object
      required:
        - mode
        - clean_shutdown
        - diagnostics_completed
        - message
      properties:
        mode:
          type: string
          enum: [operational, diagnostics, recovery, failed]
          example: operational
        clean_shutdown:
          type: boolean
          example: true
        diagnostics_completed:
          type: boolean
          example: true
        message:
          type: string
          example: All systems operational

    IngressStatusResponse:
      type: object
      required:
        - status
        - caddy_connected
        - mdns_active
        - hostname
        - routes
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        caddy_connected:
          type: boolean
          example: true
        mdns_active:
          type: boolean
          example: true
        hostname:
          type: string
          example: sovereign.local
        routes:
          type: array
          items:
            $ref: '#/components/schemas/IngressRoute'

    IngressRoute:
      type: object
      required:
        - service
        - subpath
        - upstream
      properties:
        service:
          type: string
          example: web
        subpath:
          type: string
          example: /
        upstream:
          type: string
          example: sovereign-web:3000

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          example: https://sovereign.local/errors/database-unavailable
        title:
          type: string
          example: Service Unavailable
        status:
          type: integer
          example: 503
        detail:
          type: string
          example: SQLite WAL database failed health probe.
        instance:
          type: string
          example: /api/v1/health

    DiskInfo:
      type: object
      required:
        - name
        - path
        - model
        - size_bytes
        - type
        - rotational
        - mounted
        - is_system
      properties:
        name:
          type: string
          example: nvme0n1
        path:
          type: string
          example: /dev/nvme0n1
        model:
          type: string
          example: Samsung SSD 980 1TB
        size_bytes:
          type: integer
          format: int64
          example: 1000204886016
        type:
          type: string
          example: nvme
        rotational:
          type: boolean
          example: false
        mounted:
          type: boolean
          example: false
        mount_point:
          type: string
          example: /data
        is_system:
          type: boolean
          example: false

    DisksResponse:
      type: object
      required:
        - disks
      properties:
        disks:
          type: array
          items:
            $ref: '#/components/schemas/DiskInfo'

    StorageInitializeRequest:
      type: object
      required:
        - device
      properties:
        device:
          type: string
          example: /dev/nvme0n1

    StorageInitializeResponse:
      type: object
      required:
        - status
        - device
        - mount_point
        - message
      properties:
        status:
          type: string
          example: initialized
        device:
          type: string
          example: /dev/nvme0n1
        mount_point:
          type: string
          example: /data
        message:
          type: string
          example: Storage pool formatted and mounted successfully

    StorageNASTestRequest:
      type: object
      required:
        - type
        - host
        - share
      properties:
        type:
          type: string
          enum: [nfs, smb]
          example: smb
        host:
          type: string
          example: 192.168.1.100
        share:
          type: string
          example: media
        username:
          type: string
          example: family
        password:
          type: string
          example: secretpass
        options:
          type: string
          example: ro

    StorageNASTestResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Connection and credentials verified successfully

    StorageNASMountRequest:
      type: object
      required:
        - type
        - host
        - share
      properties:
        type:
          type: string
          enum: [nfs, smb]
          example: smb
        host:
          type: string
          example: 192.168.1.100
        share:
          type: string
          example: media
        username:
          type: string
          example: family
        password:
          type: string
          example: secretpass
        options:
          type: string
          example: rw
        target_path:
          type: string
          example: /data/media

    StorageNASMountResponse:
      type: object
      required:
        - status
        - type
        - host
        - share
        - mount_point
        - message
      properties:
        status:
          type: string
          example: mounted
        type:
          type: string
          enum: [nfs, smb]
          example: smb
        host:
          type: string
          example: 192.168.1.100
        share:
          type: string
          example: media
        mount_point:
          type: string
          example: /data/media
        message:
          type: string
          example: Network storage share mounted successfully

    StorageLocalPool:
      type: object
      required:
        - device
        - mount_point
        - filesystem
        - status
      properties:
        device:
          type: string
          example: /dev/nvme0n1
        mount_point:
          type: string
          example: /data
        filesystem:
          type: string
          example: ext4
        status:
          type: string
          example: mounted

    StorageNASStatus:
      type: object
      required:
        - configured
        - message
      properties:
        configured:
          type: boolean
          example: true
        type:
          type: string
          enum: [nfs, smb]
          example: smb
        host:
          type: string
          example: 192.168.1.100
        share:
          type: string
          example: media
        username:
          type: string
          example: family
        password:
          type: string
          example: '***'
        mount_point:
          type: string
          example: /data/media
        status:
          type: string
          enum: [connected, degraded, disconnected, error]
          example: connected
        message:
          type: string
          example: Connected

    StorageStatusResponse:
      type: object
      required:
        - status
        - pool_type
        - mount_point
        - total_bytes
        - available_bytes
        - used_bytes
      properties:
        status:
          type: string
          enum: [ok, degraded, not_configured]
          example: ok
        pool_type:
          type: string
          enum: [local, nas, hybrid, none]
          example: local
        mount_point:
          type: string
          example: /data
        total_bytes:
          type: integer
          format: int64
          example: 1000204886016
        available_bytes:
          type: integer
          format: int64
          example: 850123456789
        used_bytes:
          type: integer
          format: int64
          example: 150081429227
        local_pool:
          $ref: '#/components/schemas/StorageLocalPool'
        nas:
          $ref: '#/components/schemas/StorageNASStatus'

