  /v1/models:
    get:
      summary: List available AI models
      description: Returns OpenAI-compatible list of provisioned GGUF models, or 503 Problem Details in Safe Stub Mode.
      operationId: listAIModels
      responses:
        '200':
          description: List of available models.
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    example: list
                  data:
                    type: array
                    items:
                      type: object
        '503':
          description: Safe stub mode (no model provisioned) or service inactive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /v1/chat/completions:
    post:
      summary: OpenAI-compatible chat completion
      description: Mediates inference requests to the internal llama-server backend spoke, falling back to RFC 7807 Safe Stub Mode when no models exist.
      operationId: createChatCompletion
      parameters:
        - name: X-Inference-Priority
          in: header
          required: false
          schema:
            type: string
            enum: [interactive, background]
          description: Priority lane for inference request (default interactive)
        - name: X-Generation-Intent
          in: header
          required: false
          schema:
            type: string
            enum: [precise, balanced, creative]
          description: Pre-calibrated generation intent preset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - messages
              properties:
                model:
                  type: string
                  description: Model identifier or default
                preset:
                  type: string
                  enum: [precise, balanced, creative]
                  description: Pre-calibrated generation preset
                intent:
                  type: string
                  description: Alias for preset
                messages:
                  type: array
                  items:
                    type: object
                temperature:
                  type: number
                  description: Optional explicit temperature override
                top_p:
                  type: number
                  description: Optional explicit top_p override
                stream:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Successful chat completion response.
          content:
            application/json:
              schema:
                type: object
        '429':
          description: Inference queue capacity exceeded.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Safe stub mode (no model provisioned) or service inactive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '504':
          description: Inference queue wait timeout expired.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/ai/presets:
    get:
      summary: List generation intent presets
      description: Returns pre-calibrated generation intent presets (precise, balanced, creative) with sampling parameters and recommended use cases.
      operationId: listAIPresets
      responses:
        '200':
          description: List of available presets.
          content:
