          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIStatusResponse'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - database
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        version:
          type: string
          example: 0.1.0
        database:
          type: string
          enum: [connected, disconnected, error]
          example: connected

    BootStatusResponse:
      type: object
      required:
        - mode
        - clean_shutdown
        - diagnostics_completed
        - message
      properties:
        mode:
          type: string
          enum: [operational, diagnostics, recovery, failed]
          example: operational
        clean_shutdown:
          type: boolean
          example: true
        diagnostics_completed:
          type: boolean
          example: true
        message:
          type: string
          example: All systems operational

    IngressStatusResponse:
      type: object
      required:
        - status
        - caddy_connected
        - mdns_active
        - hostname
        - routes
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        caddy_connected:
          type: boolean
          example: true
        mdns_active:
          type: boolean
          example: true
        hostname:
          type: string
          example: sovereign.local
        routes:
          type: array
          items:
            $ref: '#/components/schemas/IngressRoute'

    IngressRoute:
      type: object
      required:
        - service
        - subpath
        - upstream
      properties:
        service:
          type: string
          example: web
        subpath:
          type: string
          example: /
        upstream:
          type: string
          example: sovereign-web:3000

    ProblemDetails:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
      properties:
        type:
          type: string
          format: uri
          example: https://sovereign.local/errors/database-unavailable
        title:
          type: string
          example: Service Unavailable
        status:
          type: integer
          example: 503
        detail:
          type: string
          example: SQLite WAL database failed health probe.
        instance:
          type: string
          example: /api/v1/health

    DiskInfo:
      type: object
      required:
        - name
        - path
        - model
        - size_bytes
        - type
        - rotational
        - mounted
        - is_system
      properties:
        name:
          type: string
          example: nvme0n1
        path:
          type: string
          example: /dev/nvme0n1
        model:
          type: string
          example: Samsung SSD 980 1TB
        size_bytes:
          type: integer
          format: int64
          example: 1000204886016
        type:
          type: string
          example: nvme
        rotational:
          type: boolean
          example: false
        mounted:
          type: boolean
          example: false
        mount_point:
          type: string
          example: /data
        is_system:
          type: boolean
          example: false

    DisksResponse:
      type: object
      required:
        - disks
      properties:
        disks:
          type: array
          items:
            $ref: '#/components/schemas/DiskInfo'

    StorageInitializeRequest:
      type: object
      required:
        - device
      properties:
        device:
          type: string
          example: /dev/nvme0n1

    StorageInitializeResponse:
      type: object
      required:
        - status
        - device
        - mount_point
        - message
      properties:
        status:
          type: string
          example: initialized
        device:
          type: string
          example: /dev/nvme0n1
        mount_point:
          type: string
          example: /data
        message:
          type: string
          example: Storage pool formatted and mounted successfully

    StorageNASTestRequest:
      type: object
      required:
        - type
        - host
        - share
      properties:
        type:
          type: string
          enum: [nfs, smb]
          example: smb
        host:
          type: string
          example: 192.168.1.100
        share:
          type: string
          example: media
        username:
          type: string
          example: family
        password:
          type: string
          example: secretpass
        options:
          type: string
          example: ro

    StorageNASTestResponse:
      type: object
      required:
        - success
        - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Connection and credentials verified successfully

    StorageNASMountRequest:
      type: object
      required:
        - type
        - host
        - share
      properties:
        type:
          type: string
          enum: [nfs, smb]
          example: smb
        host:
          type: string
          example: 192.168.1.100
        share:
          type: string
          example: media
        username:
          type: string
          example: family
        password:
          type: string
          example: secretpass
        options:
          type: string
          example: rw
        target_path:
          type: string
          example: /data/media

    StorageNASMountResponse:
      type: object
      required:
        - status
        - type
        - host
        - share
        - mount_point
        - message
      properties:
        status:
          type: string
          example: mounted
        type:
          type: string
          enum: [nfs, smb]
          example: smb
        host:
          type: string
          example: 192.168.1.100
        share:
          type: string
          example: media
        mount_point:
          type: string
          example: /data/media
        message:
          type: string
          example: Network storage share mounted successfully

    StorageLocalPool:
      type: object
      required:
        - device
        - mount_point
        - filesystem
        - status
      properties:
        device:
          type: string
          example: /dev/nvme0n1
        mount_point:
          type: string
          example: /data
        filesystem:
          type: string
          example: ext4
        status:
          type: string
          example: mounted

    StorageNASStatus:
      type: object
      required:
        - configured
        - message
      properties:
        configured:
          type: boolean
          example: true
        type:
          type: string
          enum: [nfs, smb]
