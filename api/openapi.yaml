          type: string
          enum: [operational, diagnostics, recovery, failed]
          example: operational
        clean_shutdown:
          type: boolean
          example: true
        diagnostics_completed:
          type: boolean
          example: true
        message:
          type: string
          example: All systems operational

    IngressStatusResponse:
      type: object
      required:
        - status
        - caddy_connected
        - mdns_active
        - hostname
        - routes
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        caddy_connected:
          type: boolean
          example: true
        mdns_active:
          type: boolean
          example: true
        hostname:
          type: string
          example: sovereign.local
        routes:
          type: array
