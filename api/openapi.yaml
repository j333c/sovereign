openapi: 3.1.0
info:
  title: Sovereign Core Supervisor API
  version: 0.1.0
  description: |
    Core control plane API for Sovereign Home Server appliance supervisor.
    Provides health diagnostics, boot lifecycle monitoring, and control boundaries.
servers:
  - url: http://localhost:8080
    description: Local daemon direct port
  - url: /
    description: Same-origin ingress gateway

paths:
  /api/v1/health:
    get:
      summary: Appliance health probe
      description: Returns the operational status of the supervisor daemon and database durability engine.
      operationId: getHealth
      responses:
        '200':
          description: Supervisor and database are operational.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: Database or core subsystem is unhealthy.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/system/boot-status:
    get:
      summary: Boot status and diagnostic integrity
      description: Returns the current boot tier, clean shutdown status, and diagnostic results.
      operationId: getBootStatus
      responses:
        '200':
          description: System boot status details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootStatusResponse'
        '500':
          description: Internal supervisor error retrieving boot state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Storage mount is degraded or read-only.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/system/ingress:
    get:
      summary: Ingress gateway and mDNS discovery status
      description: Returns operational status of Caddy ingress gateway, dynamic route table, and mDNS responder.
      operationId: getIngressStatus
      responses:
        '200':
          description: Ingress and network discovery status details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngressStatusResponse'
        '500':
          description: Internal supervisor error retrieving ingress status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/system/events:
    get:
      summary: Real-time SSE telemetry event stream
      description: |
        Streams real-time hardware telemetry updates (CPU, RAM, storage, NAS, optical, GPU)
        and service lifecycle events (service.pull_progress, service.health_changed, service.error)
        via Server-Sent Events.
      operationId: getSystemEvents
      responses:
        '200':
          description: Continuous Server-Sent Events telemetry stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream emitting telemetry.update and service.* events.

  /api/events:
    get:
      summary: Real-time SSE telemetry stream alias
      description: Convenience root alias for /api/v1/system/events emitting telemetry and service lifecycle events.
      operationId: getEvents
      responses:
        '200':
          description: Continuous Server-Sent Events telemetry stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream emitting telemetry.update and service.* events.


  /api/v1/storage/disks:
    get:
      summary: Enumerate available block devices
      description: Returns list of unmounted/available SATA/NVMe block devices with capacity.
      operationId: getDisks
      responses:
        '200':
          description: List of available storage disks.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DisksResponse'
        '500':
          description: Internal supervisor error retrieving block devices.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/initialize:
    post:
      summary: Format and initialize local storage pool
      description: Partitions and formats disk with ext4 write-ahead journaling and mounts under /data.
      operationId: initializeStorage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageInitializeRequest'
      responses:
        '200':
          description: Storage pool successfully initialized and mounted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageInitializeResponse'
        '400':
          description: Invalid device or device is in use / protected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error formatting or mounting storage pool.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/nas/test:
    post:
      summary: Test network storage credentials
      description: Performs non-destructive credential and mount accessibility test.
      operationId: testNAS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageNASTestRequest'
      responses:
        '200':
          description: Network storage credentials and connectivity verified successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageNASTestResponse'
        '400':
          description: Authentication failed or invalid configuration.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error testing network storage.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/nas/mount:
    post:
      summary: Save and mount network storage share
      description: Mounts network share to /data/media or target folder and persists config in SQLite.
      operationId: mountNAS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorageNASMountRequest'
      responses:
        '200':
          description: Network storage share mounted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageNASMountResponse'
        '400':
          description: Invalid NAS request or failed validation.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Mount execution failed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/storage/status:
    get:
      summary: Get storage pool and NAS mount status
      description: Returns operational status, filesystem capacity, local pool, and network share health.
      operationId: getStorageStatus
      responses:
        '200':
          description: Storage status and capacity telemetry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageStatusResponse'
        '500':
          description: Internal supervisor error retrieving storage status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/setup-status:
    get:
      summary: Check first-run setup completion status
      description: Returns whether the appliance has completed the first-run onboarding setup wizard.
      operationId: getSetupStatus
      responses:
        '200':
          description: Setup configuration state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupStatusResponse'
        '500':
          description: Internal error checking setup state.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/setup:
    post:
      summary: Complete first-run setup wizard
      description: Sets language, storage, features, and creates administrator credentials with Argon2id hashing.
      operationId: completeSetup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupRequest'
      responses:
        '200':
          description: Setup successfully completed with active admin session.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sovereign_session=4a7c...; Path=/; HttpOnly; SameSite=Strict; Max-Age=2592000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          description: Validation error (e.g. password < 8 characters or invalid email format).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Appliance setup has already been completed.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal error completing setup.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/login:
    post:
      summary: Administrative user login
      description: Authenticates administrator credentials and issues session cookie.
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authentication successful.
          headers:
            Set-Cookie:
              schema:
                type: string
                example: sovereign_session=4a7c...; Path=/; HttpOnly; SameSite=Strict; Max-Age=2592000
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          description: Invalid username or password.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal error during authentication.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/auth/logout:
    post:
      summary: Terminate session and logout
      description: Revokes session in persistent database and clears session cookie.
      operationId: logout
      responses:
        '200':
          description: Session terminated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'

  /api/v1/auth/session:
    get:
      summary: Check active session details
      description: Returns information about the currently authenticated session.
      operationId: getSession
      responses:
        '200':
          description: Active session details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          description: No active or valid session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/settings:
    get:
      summary: Retrieve administrative settings
      description: Returns configuration settings. Requires administrative privileges.
      operationId: getSettings
      responses:
        '200':
          description: Configuration settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          description: Authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrative privileges required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Update administrative settings
      description: Updates key-value settings. Requires administrative privileges.
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties:
                type: string
      responses:
        '200':
          description: Settings updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
        '400':
          description: Malformed payload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Administrative privileges required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/services:
    get:
      summary: List managed services
      description: Returns list of managed appliance services and their container lifecycle states.
      operationId: getServices
      responses:
        '200':
          description: List of services.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServicesListResponse'
        '500':
          description: Internal supervisor error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/services/{id}:
    get:
      summary: Get service status
      description: Returns lifecycle and health details for a specific managed service.
      operationId: getService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jellyfin
      responses:
        '200':
          description: Service status details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '404':
          description: Service not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/services/{id}/activate:
    post:
      summary: Activate managed service on-demand
      description: Pulls OCI image from official repository on-demand and starts container with bounded memory.
      operationId: activateService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jellyfin
      responses:
        '200':
          description: Service activated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '202':
          description: Service activation initiated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '404':
          description: Service not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '502':
          description: Image pull failed (network or registry error).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/services/{id}/deactivate:
    post:
      summary: Deactivate managed service
      description: Stops container runtime and preserves persistent data volumes under /data.
      operationId: deactivateService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jellyfin
      responses:
        '200':
          description: Service deactivated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '404':
          description: Service not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/services/{id}/restart:
    post:
      summary: Restart managed service container
      description: Restarts container runtime. Requires administrative authentication if configured.
      operationId: restartService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jellyfin
      responses:
        '200':
          description: Service restarted successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'
        '401':
          description: Administrative authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Service not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/services/{id}/refresh:
    post:
      summary: Refresh media service library
      description: Triggers immediate library refresh webhook in the specified media service (e.g. Jellyfin, Navidrome, Audiobookshelf).
      operationId: refreshService
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            example: jellyfin
      responses:
        '200':
          description: Library refresh triggered successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
                  service:
                    type: string
                    example: jellyfin
                  refreshed:
                    type: boolean
                    example: true
        '400':
          description: Service does not support library refresh.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Service not found.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: Service inactive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/drop/upload:
    post:
      summary: Upload media file to dropzone
      description: |
        Streams incoming media upload to atomic staging file, validates magic bytes
        (MP4, MKV, WebM, AVI, MPEG-TS, MP3, FLAC, WAV, OGG, Opus, M4A, M4B, AAC),
        atomically moves verified file to /data/media/:category, and triggers library refresh.
      operationId: uploadDropMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - category
                - file
              properties:
                category:
                  type: string
                  enum: [movies, tv, music, audiobooks]
                  description: Target media library category
                file:
                  type: string
                  format: binary
                  description: Media file payload to ingest
      responses:
        '200':
          description: Media file verified and promoted to media library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropUploadResponse'
        '400':
          description: Missing or invalid category or file field.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Non-media or invalid magic bytes payload rejected.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal supervisor error processing upload.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/drop/history:
    get:
      summary: Retrieve dropzone upload history
      description: Returns recent list of ingested media files and promotion status.
      operationId: getDropHistory
      responses:
        '200':
          description: Ingestion history items.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DropHistoryResponse'
        '500':
          description: Internal supervisor error retrieving dropzone history.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/optical/status:
    get:
      summary: Optical drive and disc ripping engine status
      description: Returns real-time optical drive hardware status, disc media detection, ripping progress, and encryption key state.
      operationId: getOpticalStatus
      responses:
        '200':
          description: Optical drive and ripping engine status details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpticalStatusResponse'
        '500':
          description: Internal supervisor error retrieving optical status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/optical/eject:
    post:
      summary: Eject optical drive tray
      description: Manually triggers the optical drive tray ejection and resets ripping status to idle.
      operationId: ejectOpticalDrive
      responses:
        '200':
          description: Drive tray ejected successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpticalEjectResponse'
        '500':
          description: Failed to eject optical drive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/optical/keys:
    post:
      summary: Upload AACS KEYDB.cfg decryption keys
      description: Atomically uploads and validates KEYDB.cfg decryption keys for commercial Blu-ray ripping.
      operationId: uploadOpticalKeys
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
          text/plain:
            schema:
              type: string
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '200':
          description: Decryption keys uploaded and activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpticalKeysUploadResponse'
        '400':
          description: Empty or invalid KEYDB.cfg file.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Unauthorized session.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - administrator session required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '413':
          description: Key file payload exceeds size limit (10MB).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal error storing key file.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/enrichment/status:
    get:
      summary: Media metadata and artwork enrichment engine status
      description: Returns real-time status of the media enrichment engine, active jobs, scan timestamps, and processed count.
      operationId: getEnrichmentStatus
      responses:
        '200':
          description: Real-time enrichment engine status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentStatusResponse'
        '500':
          description: Internal supervisor error retrieving enrichment status.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/enrichment/scan:
    post:
      summary: Trigger manual enrichment scan
      description: Initiates an immediate scan of staged optical discs, enriches metadata and artwork, promotes media, and dispatches library refreshes.
      operationId: triggerEnrichmentScan
      responses:
        '200':
          description: Enrichment scan completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichmentScanResponse'
        '500':
          description: Internal error executing enrichment scan.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/transcode/queue:
    get:
      summary: List transcoding queue
      description: Returns the list of video transcoding jobs, their progress, and current active encode status.
      operationId: getTranscodeQueue
      responses:
        '200':
          description: Transcoding queue list retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeQueueResponse'
        '500':
          description: Internal supervisor error querying transcode queue.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Enqueue media file for background transcoding
      description: Enqueues a raw video rip or imported media file for universal direct-play pre-encoding.
      operationId: enqueueTranscode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnqueueTranscodeRequest'
      responses:
        '201':
          description: Media file enqueued successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeJobResponse'
        '400':
          description: Missing or invalid source file path.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Failed to enqueue media file.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/transcode/schedule:
    get:
      summary: Get off-peak transcoding schedule
      description: Returns the configured off-peak transcoding window and active state.
      operationId: getTranscodeSchedule
      responses:
        '200':
          description: Schedule retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeScheduleResponse'
        '500':
          description: Failed to retrieve schedule.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      summary: Update off-peak transcoding schedule
      description: Updates the daily off-peak window hours for batch video encoding.
      operationId: updateTranscodeSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTranscodeScheduleRequest'
      responses:
        '200':
          description: Schedule updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeScheduleResponse'
        '400':
          description: Invalid schedule configuration.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Administrative authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - admin privileges required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Failed to update schedule.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/transcode/override:
    post:
      summary: Override daytime transcoding restriction
      description: Manually enables or disables daytime batch transcoding, bypassing GPU arbitration.
      operationId: setTranscodeOverride
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscodeOverrideRequest'
      responses:
        '200':
          description: Manual override state updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscodeOverrideResponse'
        '400':
          description: Invalid override request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Administrative authentication required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Forbidden - admin privileges required.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Failed to set manual override.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
        - database
      properties:
        status:
          type: string
          enum: [ok, degraded, error]
          example: ok
        version:
          type: string
          example: 0.1.0
        database:
          type: string
          enum: [connected, disconnected, error]
          example: connected

    BootStatusResponse:
      type: object
